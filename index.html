<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ระบบตรวจนับครุภัณฑ์</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--navy:#0c2f53;--green:#127c56;--red:#b42318;--bg:#f6f8fa;--border:#d9dee5;--text:#17212b;--muted:#667085}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Thai",sans-serif}
.app{width:min(100%,720px);min-height:100vh;margin:auto;background:#fff}header{padding:18px 16px;background:var(--navy);color:#fff}
header h1{margin:0;font-size:20px}header p{margin:6px 0 0;font-size:13px;opacity:.85}main{padding:16px}
.scanner-card,.details{border:1px solid var(--border);border-radius:10px;background:#fff}.scanner-card{padding:12px}
#reader{width:100%;overflow:hidden;border-radius:8px;min-height:240px;background:#111}
#reader video{width:100%!important;height:auto!important;max-height:70vh;object-fit:cover;display:block}
#reader__scan_region{width:100%!important}
#reader__scan_region img{display:none!important}
@media (max-width:600px){
  main{padding:10px}
  .scanner-card{padding:8px}
  #reader{min-height:260px;border-radius:10px}
  #reader video{max-height:62vh;object-fit:cover}
  .manual-row{grid-template-columns:1fr 96px}
  header{padding:15px 14px}
  header h1{font-size:18px}
}.actions{display:grid;gap:10px;margin-top:12px}
button{min-height:48px;border:0;border-radius:6px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;display:block}
.primary{background:var(--navy);color:#fff}.secondary{background:#eef1f4;color:var(--text)}button:disabled{opacity:.5;cursor:not-allowed}
.status{display:none;margin-top:14px;border-radius:10px;padding:14px;border:1px solid var(--border)}.status.show{display:block}
.status.success{border-color:#8bd0b3;background:#f0faf6}.status.warning{border-color:#f2c27b;background:#fff9ed}.status.error{border-color:#f0a7a2;background:#fff5f4}
.status-title{font-size:18px;font-weight:800;margin-bottom:4px}.status-code{color:var(--muted);font-size:13px;line-height:1.5}
.details{display:none;margin-top:14px;overflow:hidden}.details.show{display:block}.detail-row{display:grid;grid-template-columns:42% 58%;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:0}.detail-label,.detail-value{padding:11px 12px;overflow-wrap:anywhere}.detail-label{background:#f8fafc;color:var(--muted);font-size:13px}.detail-value{font-weight:600;font-size:14px}
.hint{margin:12px 2px 0;color:var(--muted);font-size:13px;line-height:1.5}.manual{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.manual label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.manual-row{display:grid;grid-template-columns:1fr 110px;gap:8px}
input[type=text]{width:100%;min-height:48px;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:16px;outline:none}.loading{opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<header><h1>ระบบตรวจนับครุภัณฑ์</h1><p>สแกน QR Code เพื่อตรวจนับและบันทึกวันเวลาการตรวจนับ</p></header>
<main>
<section class="scanner-card"><div id="reader"></div>
<div class="actions">
  <button id="startBtn" class="primary" type="button">📷 เริ่มสแกน</button>
  <button id="stopBtn" class="secondary" type="button" disabled>หยุดสแกน</button>
</div>
<p class="hint">กด “เริ่มสแกน” เพื่อเปิดกล้องสด จากนั้นหันกล้องไปที่ QR Code ของครุภัณฑ์ ระบบจะอ่านรหัสให้อัตโนมัติ</p></section>
<div id="status" class="status"></div><div id="details" class="details"></div>
<button id="nextBtn" class="primary" type="button" style="display:none;width:100%;margin-top:14px">📷 สแกนชิ้นต่อไป</button>
<section class="manual"><label for="manualCode">กรอกรหัสด้วยตนเอง (กรณีกล้องใช้งานไม่ได้)</label><div class="manual-row"><input id="manualCode" type="text" placeholder="เช่น depa620101336" autocomplete="off"><button class="primary" type="button" id="manualBtn">ค้นหา</button></div></section>
</main></div>
<script>
// ===== ตั้งค่า: URL ของ Apps Script Web App (ลงท้ายด้วย /exec) =====
const API_URL='https://script.google.com/macros/s/AKfycbx2BZJGGdmXBPV-qVF1xBtyaPP8C5FGRe3P1djcSavVjQYxwaytqEW57yMHoozHykaM/exec';

let scanner=null;
let scannerState='idle'; // idle | starting | running | stopping
let processing=false;
let lastCode='';
let lastScanTime=0;

const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const manualBtn=document.getElementById('manualBtn');
const statusBox=document.getElementById('status');
const details=document.getElementById('details');
const manualCode=document.getElementById('manualCode');
const nextBtn=document.getElementById('nextBtn');

function setScannerButtons(){
  const busy=scannerState==='starting'||scannerState==='stopping';
  startBtn.disabled=busy||scannerState==='running';
  stopBtn.disabled=busy||scannerState!=='running';
}

function isInAppBrowser(){
  return /Line\/|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/i.test(navigator.userAgent);
}

function waitForQrLibrary(timeout=15000){
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    (function check(){
      if(typeof Html5Qrcode!=='undefined') return resolve();
      if(Date.now()-started>=timeout) return reject(new Error('โหลดตัวสแกน QR ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)'));
      setTimeout(check,100);
    })();
  });
}

async function startScanner(){
  if(scannerState!=='idle') return;
  scannerState='starting';
  setScannerButtons();
  clearDetails();

  try{
    await waitForQrLibrary();

    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('NO_MEDIA');
    }

    scanner=new Html5Qrcode('reader');

    try{
      await scanner.start(
        {
          // html5-qrcode รับ cameraIdOrConfig แบบ object ได้เพียง 1 key
          facingMode:'environment'
        },
        {
          fps:15,
          formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
          qrbox:(w,h)=>{
            const s=Math.max(260,Math.min(520,Math.floor(Math.min(w,h)*0.94)));
            return {width:s,height:s};
          },
          aspectRatio:1,
          disableFlip:false
        },
        onScanSuccess,
        ()=>{}
      );

      // พยายามเปิด autofocus ต่อเนื่องและเพิ่ม zoom เล็กน้อย หากอุปกรณ์รองรับ
      try{
        const video=document.querySelector('#reader video');
        const stream=video?.srcObject;
        const track=stream?.getVideoTracks?.()[0];
        const caps=track?.getCapabilities?.();
        if(track&&caps){
          const advanced={};
          if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous')){
            advanced.focusMode='continuous';
          }
          if(caps.zoom){
            advanced.zoom=Math.min(caps.zoom.max ?? 1.5,Math.max(caps.zoom.min ?? 1,1.15));
          }
          if(Object.keys(advanced).length){
            await track.applyConstraints({advanced:[advanced]});
          }
        }
      }catch(_){}
    }catch(firstErr){
      // ไม่เรียก scanner.start() ซ้ำระหว่าง transition
      throw firstErr;
    }

    scannerState='running';
    showStatus('success','พร้อมสแกน','หันกล้องไปที่ QR Code ของครุภัณฑ์');
  }catch(error){
    // start() ล้มเหลวระหว่าง transition: clear อย่างเดียว ห้าม stop() ซ้ำ
    const failed=scanner;
    scanner=null;
    try{if(failed) await failed.clear();}catch(_){}
    scannerState='idle';
    setScannerButtons();
    showCameraError(error);
  }finally{
    if(scannerState==='starting') scannerState='idle';
    setScannerButtons();
  }
}

function showCameraError(error){
  const msg=String(error?.message||error||'');
  let hint='';
  if(isInAppBrowser()){
    hint='ดูเหมือนเปิดลิงก์ในแอป (เช่น LINE/Facebook) ซึ่งมักบล็อกกล้อง กรุณาเปิดลิงก์ด้วย Chrome/Safari แทน';
  }else if(msg==='NO_MEDIA'){
    hint='เบราว์เซอร์ไม่อนุญาตให้ใช้กล้องในหน้านี้ ต้องเปิดผ่าน HTTPS ด้วย Chrome/Safari';
  }else if(/permission|denied|notallowed|not allowed|policy/i.test(msg)){
    hint='กรุณากดไอคอนแม่กุญแจที่แถบที่อยู่เว็บ เลือก “อนุญาต” กล้อง แล้วกด “เริ่มสแกน” ใหม่';
  }else if(/NotFound|no camera|not found|ไม่พบ/i.test(msg)){
    hint='ไม่พบกล้องในอุปกรณ์นี้ กรุณาใช้อุปกรณ์ที่มีกล้อง หรือกรอกรหัสด้วยตนเอง';
  }else{
    hint=escapeHtml(msg||'กรุณาลองใหม่');
  }
  const raw=escapeHtml((error&&error.name?error.name+': ':'')+msg);
  showStatus('error','เปิดกล้องไม่ได้',hint+'<br><small style="color:#98a2b3">รายละเอียด: '+raw+'</small>');
}

async function destroyScanner(){
  const old=scanner;
  scanner=null;
  scannerState='idle';
  if(old){
    try{await old.stop();}catch(_){}
    try{old.clear();}catch(_){}
  }
  setScannerButtons();
}

async function stopScanner(){
  if(scannerState!=='running') return;
  scannerState='stopping';
  setScannerButtons();
  await destroyScanner();
}

function onScanSuccess(decodedText){
  const code=String(decodedText||'').trim();
  const now=Date.now();
  if(!code||processing) return;
  if(code===lastCode&&now-lastScanTime<3000) return;
  lastCode=code;
  lastScanTime=now;
  processCode(code);
}

function submitManual(){
  const code=manualCode.value.trim();
  if(!code){showStatus('error','กรุณากรอกรหัส','');return;}
  processCode(code);
}

// เรียก Apps Script ด้วย JSONP (หน้านี้โฮสต์นอก Apps Script จึงใช้ google.script.run ไม่ได้)
async function processCode(code){
  if(!code||processing) return;
  processing=true;
  document.body.classList.add('loading');

  if(scannerState==='running') await stopScanner();

  showStatus('success','กำลังตรวจสอบ...','รหัส '+escapeHtml(code));
  clearDetails();

  const callbackName='stockCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  let finished=false;

  function cleanup(){
    clearTimeout(timer);
    processing=false;
    document.body.classList.remove('loading');
    try{delete window[callbackName];}catch(_){window[callbackName]=undefined;}
    script.remove();
  }

  const timer=setTimeout(()=>{
    if(finished) return;
    finished=true;
    cleanup();
    showStatus('error','หมดเวลาเชื่อมต่อ','ระบบไม่ตอบกลับภายใน 20 วินาที กรุณาลองใหม่');
  },20000);

  window[callbackName]=function(result){
    if(finished) return;
    finished=true;
    cleanup();
    handleResult(result);
  };

  script.onerror=function(){
    if(finished) return;
    finished=true;
    cleanup();
    showStatus('error','เชื่อมต่อ Apps Script ไม่สำเร็จ','ตรวจสอบว่า Web App ถูก Deploy เป็น “Anyone” และ URL ถูกต้อง (และ Deploy เวอร์ชันใหม่หลังแก้ Code.gs แล้ว)');
  };

  script.src=API_URL
    +'?action=markAsCounted'
    +'&code='+encodeURIComponent(code)
    +'&callback='+encodeURIComponent(callbackName);
  document.body.appendChild(script);
}

function handleResult(result){
  if(!result){showStatus('error','เกิดข้อผิดพลาด','ไม่ได้รับข้อมูลจากระบบ');return;}
  if(result.type==='NOT_FOUND'){showStatus('error','✕ ไม่พบข้อมูล','รหัส '+escapeHtml(result.code||''));return;}
  if(result.type==='INVALID'){showStatus('error','ข้อมูลไม่ถูกต้อง',escapeHtml(result.message||''));return;}
  if(result.type==='ALREADY_COUNTED'){
    showStatus('warning','⚠️ รายการนี้นับแล้ว','นับเมื่อ '+escapeHtml(result.asset?.countedAt||'-'));
    renderDetails(result.asset);return;
  }
  if(result.type==='COUNTED'){
    showStatus('success','✓ นับรายการเรียบร้อย','บันทึกเมื่อ '+escapeHtml(result.asset?.countedAt||'-'));
    renderDetails(result.asset);return;
  }
  showStatus('error','ไม่ทราบผลการตรวจสอบ','');
}

function renderDetails(asset){
  if(!asset) return;
  const rows=[
    ['รหัส',asset.code],
    ['ชื่อครุภัณฑ์',asset.name],
    ['จำนวนเงิน',formatNumber(asset.amount)],
    ['จำนวนปัจจุบัน',asset.currentQuantity],
    ['สถานะ',asset.counted],
    ['วันเวลาที่ตรวจนับ',asset.countedAt],
    ['Location',asset.location],
    ['หมายเหตุ',asset.note]
  ];
  details.innerHTML=rows.map(([label,value])=>
    '<div class="detail-row"><div class="detail-label">'+escapeHtml(label)+'</div>'+
    '<div class="detail-value">'+escapeHtml(value??'-')+'</div></div>'
  ).join('');
  details.classList.add('show');
  nextBtn.style.display='block';
}

function clearDetails(){details.innerHTML='';details.classList.remove('show');nextBtn.style.display='none';}

function showStatus(type,title,message){
  statusBox.className='status show '+type;
  statusBox.innerHTML='<div class="status-title">'+title+'</div><div class="status-code">'+(message||'')+'</div>';
}

function formatNumber(value){
  if(value===null||value===undefined||value==='') return '-';
  const number=Number(value);
  return Number.isFinite(number)?number.toLocaleString('th-TH',{maximumFractionDigits:2}):String(value);
}

function escapeHtml(value){
  return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

startBtn.addEventListener('click',startScanner);
stopBtn.addEventListener('click',stopScanner);
manualBtn.addEventListener('click',submitManual);
nextBtn.addEventListener('click',startScanner);
manualCode.addEventListener('keydown',e=>{if(e.key==='Enter') submitManual();});

setScannerButtons();
if(isInAppBrowser()){
  showStatus('warning','แนะนำให้เปิดด้วย Chrome/Safari','เบราว์เซอร์ในแอป (เช่น LINE) มักเปิดกล้องสดไม่ได้ หากเปิดไม่ได้ให้เปิดลิงก์นี้ด้วย Chrome/Safari แทน');
}
</script>
</body>
</html>
