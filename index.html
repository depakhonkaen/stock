<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>ระบบตรวจนับครุภัณฑ์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      :root {
        --navy: #0c2f53;
        --green: #127c56;
        --red: #b42318;
        --bg: #f6f8fa;
        --border: #d9dee5;
        --text: #17212b;
        --muted: #667085;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Sarabun", "Noto Sans Thai Looped", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 16px;
        line-height: 1.5;
      }
      .app {
        width: min(100%, 720px);
        min-height: 100vh;
        margin: auto;
        background: #fff;
      }
      header {
        padding: 18px 16px;
        background: var(--navy);
        color: #fff;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header p {
        margin: 6px 0 0;
        font-size: 13px;
        opacity: 0.85;
      }
      main {
        padding: 16px;
      }
      .scanner-card,
      .details {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }
      .scanner-card {
        padding: 12px;
      }
      #reader {
        width: 100%;
        overflow: hidden;
        border-radius: 8px;
        min-height: 240px;
        background: #111;
      }
      #reader video {
        width: 100% !important;
        height: auto !important;
        max-height: 70vh;
        object-fit: cover;
        display: block;
      }
      #reader__scan_region {
        width: 100% !important;
      }
      #reader__scan_region img {
        display: none !important;
      }
      @media (max-width: 600px) {
        main {
          padding: 10px;
        }
        .scanner-card {
          padding: 8px;
        }
        #reader {
          min-height: 260px;
          border-radius: 10px;
        }
        #reader video {
          max-height: 62vh;
          object-fit: cover;
        }
        .manual-row {
          grid-template-columns: 1fr 96px;
        }
        header {
          padding: 15px 14px;
        }
        header h1 {
          font-size: 18px;
        }
      }
      .actions {
        display: grid;
        gap: 10px;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      button i {
        font-size: 1.05em;
      }
      .primary {
        background: var(--navy);
        color: #fff;
      }
      .secondary {
        background: #eef1f4;
        color: var(--text);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        display: none;
        margin-top: 14px;
        border-radius: 10px;
        padding: 14px;
        border: 1px solid var(--border);
      }
      .status.show {
        display: block;
      }
      .status.success {
        border-color: #8bd0b3;
        background: #f0faf6;
      }
      .status.warning {
        border-color: #f2c27b;
        background: #fff9ed;
      }
      .status.error {
        border-color: #f0a7a2;
        background: #fff5f4;
      }
      .status-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .status.success .status-title i {
        color: var(--green);
      }
      .status.warning .status-title i {
        color: #b54708;
      }
      .status.error .status-title i {
        color: var(--red);
      }
      .status-code {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .details {
        display: none;
        margin-top: 14px;
        overflow: hidden;
      }
      .details.show {
        display: block;
      }
      .detail-row {
        display: grid;
        grid-template-columns: 42% 58%;
        border-bottom: 1px solid var(--border);
      }
      .detail-row:last-child {
        border-bottom: 0;
      }
      .detail-label,
      .detail-value {
        padding: 11px 12px;
        overflow-wrap: anywhere;
      }
      .detail-label {
        background: #f8fafc;
        color: var(--muted);
        font-size: 13px;
      }
      .detail-value {
        font-weight: 500;
        font-size: 14px;
      }
      .hint {
        margin: 12px 2px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .manual {
        margin-top: 16px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      .manual label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .manual-row {
        display: grid;
        grid-template-columns: 1fr 110px;
        gap: 8px;
      }
      input[type="text"] {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 16px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: var(--navy);
        box-shadow: 0 0 0 3px rgba(12, 47, 83, 0.12);
      }
      .loading {
        opacity: 0.7;
        pointer-events: none;
      }
      .cam {
        position: relative;
        display: none;
        margin-bottom: 12px;
      }
      .cam.show {
        display: block;
      }
      #reader {
        touch-action: none;
      }
      .diag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        font-size: 12px;
        color: #98a2b3;
      }
      .engine-btn {
        flex: none;
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        cursor: pointer;
      }
      .focus-ring {
        position: absolute;
        width: 64px;
        height: 64px;
        margin: -32px 0 0 -32px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
        pointer-events: none;
        opacity: 0;
        z-index: 5;
      }
      .focus-ring.show {
        animation: focusPulse 0.9s ease-out;
      }
      @keyframes focusPulse {
        0% {
          opacity: 1;
          transform: scale(1.5);
        }
        60% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1);
        }
      }
      .cam-tools {
        display: none;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .cam-tools.show {
        display: flex;
      }
      .cam-tools button {
        flex: none;
        width: 48px;
        min-height: 44px;
        padding: 0;
        font-size: 18px;
      }
      .cam-tools input[type="range"] {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0;
        border: 0;
        accent-color: var(--navy);
      }
      .zoom-label {
        flex: none;
        min-width: 48px;
        text-align: right;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      .cam-note {
        display: none;
        margin: 8px 2px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .cam-note.show {
        display: block;
      }
      .pick {
        background: #e7f3ee;
        color: var(--green);
        border: 1px solid #8bd0b3;
      }
      #fileInput {
        display: none;
      }
      #fileReader {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 300px;
        height: 300px;
        overflow: hidden;
      }
      .preview {
        display: none;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
      }
      .preview.show {
        display: flex;
      }
      .preview img {
        flex: none;
        width: 72px;
        height: 72px;
        object-fit: contain;
        background: #f8fafc;
        border-radius: 6px;
      }
      .preview .pname {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .preview button {
        flex: none;
        min-height: 36px;
        padding: 6px 12px;
        font-size: 14px;
      }
      .drag {
        outline: 2px dashed var(--green);
        outline-offset: -4px;
        background: #f0faf6;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1><i class="fa-solid fa-qrcode"></i>ระบบตรวจนับครุภัณฑ์</h1>
        <p>สแกน QR Code เพื่อตรวจนับและบันทึกวันเวลาการตรวจนับ</p>
      </header>
      <main>
        <section class="scanner-card">
          <div class="cam" id="camBox">
            <div id="reader"></div>
            <div id="focusRing" class="focus-ring"></div>
            <div class="diag-row">
              <span id="diag"></span>
              <button id="engineBtn" class="engine-btn" type="button">
                สลับตัวอ่าน
              </button>
            </div>
          </div>
          <div id="camTools" class="cam-tools">
            <button
              id="zoomOut"
              class="secondary"
              type="button"
              aria-label="ซูมออก"
            >
              <i class="fa-solid fa-minus"></i></button
            ><input
              id="zoomRange"
              type="range"
              min="1"
              max="1"
              step="0.1"
              value="1"
              aria-label="ซูม"
            /><button
              id="zoomIn"
              class="secondary"
              type="button"
              aria-label="ซูมเข้า"
            >
              <i class="fa-solid fa-plus"></i></button
            ><span id="zoomLabel" class="zoom-label">1.0×</span>
          </div>
          <p id="camNote" class="cam-note"></p>
          <div class="actions">
            <button id="startBtn" class="primary" type="button">
              <i class="fa-solid fa-camera"></i>เริ่มสแกน
            </button>
            <button id="stopBtn" class="secondary" type="button" disabled>
              <i class="fa-solid fa-stop"></i>หยุดสแกน
            </button>
            <button id="pickBtn" class="pick" type="button">
              <i class="fa-solid fa-image"></i>เลือกรูป QR Code จากเครื่อง
            </button>
            <input id="fileInput" type="file" accept="image/*" />
          </div>
          <div id="preview" class="preview">
            <img id="previewImg" alt="รูป QR Code ที่เลือก" />
            <div id="previewName" class="pname"></div>
            <button id="previewClear" class="secondary" type="button">
              <i class="fa-solid fa-trash-can"></i>ลบรูป
            </button>
          </div>
          <div id="fileReader" aria-hidden="true"></div>
        </section>
        <div id="status" class="status"></div>
        <div id="details" class="details"></div>
        <button
          id="nextBtn"
          class="primary"
          type="button"
          style="display: none; width: 100%; margin-top: 14px"
        >
          <i class="fa-solid fa-camera"></i>สแกนชิ้นต่อไป
        </button>
        <section class="manual">
          <label for="manualCode"
            ><i class="fa-solid fa-keyboard"></i>กรอกรหัสด้วยตนเอง</label
          >
          <div class="manual-row">
            <input
              id="manualCode"
              type="text"
              placeholder="เช่น ขก470112001"
              autocomplete="off"
            /><button class="primary" type="button" id="manualBtn">
              <i class="fa-solid fa-magnifying-glass"></i>ค้นหา
            </button>
          </div>
        </section>
      </main>
    </div>
    <script>
      // ===== ตั้งค่า: URL ของ Apps Script Web App (ลงท้ายด้วย /exec) =====
      const API_URL =
        "https://script.google.com/macros/s/AKfycbx2BZJGGdmXBPV-qVF1xBtyaPP8C5FGRe3P1djcSavVjQYxwaytqEW57yMHoozHykaM/exec";

      let scanner = null;
      let scannerState = "idle"; // idle | starting | running | stopping
      let processing = false;
      let lastCode = "";
      let lastScanTime = 0;

      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const manualBtn = document.getElementById("manualBtn");
      const statusBox = document.getElementById("status");
      const details = document.getElementById("details");
      const manualCode = document.getElementById("manualCode");
      const nextBtn = document.getElementById("nextBtn");

      function setScannerButtons() {
        const busy = scannerState === "starting" || scannerState === "stopping";
        startBtn.disabled = busy || scannerState === "running";
        stopBtn.disabled = busy || scannerState !== "running";
      }

      function isInAppBrowser() {
        return /Line\/|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/i.test(
          navigator.userAgent,
        );
      }

      function waitForQrLibrary(timeout = 15000) {
        return new Promise((resolve, reject) => {
          const started = Date.now();
          (function check() {
            if (typeof Html5Qrcode !== "undefined") return resolve();
            if (Date.now() - started >= timeout)
              return reject(
                new Error("โหลดตัวสแกน QR ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)"),
              );
            setTimeout(check, 100);
          })();
        });
      }

      // ===== ควบคุมกล้อง: แตะเพื่อโฟกัส / ซูม (แถบเลื่อน, ปุ่ม +/-, บีบนิ้ว) =====
      const camTools = document.getElementById("camTools");
      const camNote = document.getElementById("camNote");
      const zoomRange = document.getElementById("zoomRange");
      const zoomLabel = document.getElementById("zoomLabel");
      const zoomInBtn = document.getElementById("zoomIn");
      const zoomOutBtn = document.getElementById("zoomOut");
      const focusRing = document.getElementById("focusRing");
      const readerEl = document.getElementById("reader");

      let camTrack = null;
      let camCaps = null;
      let zoomValue = 1;
      let zoomBusy = false;
      let zoomPending = null;
      let focusTimer = null;
      let pinchStartDist = 0;
      let pinchStartZoom = 1;
      let lastPinchAt = 0;

      function getCamTrack() {
        const video = document.querySelector("#reader video");
        const stream = video && video.srcObject;
        return stream && stream.getVideoTracks
          ? stream.getVideoTracks()[0] || null
          : null;
      }

      async function tryConstraint(c) {
        try {
          await camTrack.applyConstraints({ advanced: [c] });
          return true;
        } catch (_) {
          return false;
        }
      }

      function showCamNote(text) {
        camNote.textContent = text || "";
        camNote.classList.toggle("show", !!text);
      }

      function resetCameraControls() {
        clearTimeout(focusTimer);
        camTrack = null;
        camCaps = null;
        zoomBusy = false;
        zoomPending = null;
        pinchStartDist = 0;
        camTools.classList.remove("show");
        showCamNote("");
      }

      async function setupCameraControls() {
        resetCameraControls();
        try {
          camTrack = getCamTrack();
          if (!camTrack || !camTrack.getCapabilities) return;
          camCaps = camTrack.getCapabilities();

          // โฟกัสอัตโนมัติแบบต่อเนื่อง (ถ้ารองรับ)
          if (
            Array.isArray(camCaps.focusMode) &&
            camCaps.focusMode.includes("continuous")
          ) {
            await tryConstraint({ focusMode: "continuous" });
          }

          // ซูม (Chrome บน Android รองรับ / iPhone Safari ส่วนใหญ่ไม่รองรับ)
          if (camCaps.zoom && camCaps.zoom.max > camCaps.zoom.min) {
            const min = camCaps.zoom.min,
              max = camCaps.zoom.max;
            zoomRange.min = min;
            zoomRange.max = max;
            zoomRange.step = camCaps.zoom.step || 0.1;
            camTools.classList.add("show");
            await applyZoom(Math.min(max, Math.max(min, 1.5)));
          } else {
            showCamNote(
              "อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับการซูมกล้องด้วยระบบ ให้ขยับเครื่องเข้าใกล้ QR Code แทน",
            );
          }
        } catch (_) {}
      }

      function updateZoomUi() {
        zoomRange.value = zoomValue;
        zoomLabel.textContent = zoomValue.toFixed(1) + "×";
      }

      async function applyZoom(v) {
        if (!camTrack || !camCaps || !camCaps.zoom) return;
        v = Math.min(camCaps.zoom.max, Math.max(camCaps.zoom.min, v));
        zoomValue = v;
        updateZoomUi();
        zoomPending = v;
        if (zoomBusy) return;
        zoomBusy = true;
        try {
          while (zoomPending !== null) {
            const target = zoomPending;
            zoomPending = null;
            await tryConstraint({ zoom: target });
          }
        } finally {
          zoomBusy = false;
        }
      }

      function zoomStepSize() {
        if (!camCaps || !camCaps.zoom) return 0.5;
        const z = camCaps.zoom;
        return Math.max(z.step || 0.1, (z.max - z.min) / 8);
      }

      async function focusAt(nx, ny) {
        if (!camTrack || !camCaps || !Array.isArray(camCaps.focusMode)) return;
        const modes = camCaps.focusMode;
        const canContinuous = modes.includes("continuous");
        const poi = [{ x: nx, y: ny }];

        if (modes.includes("single-shot")) {
          if (
            !(await tryConstraint({
              focusMode: "single-shot",
              pointsOfInterest: poi,
            }))
          ) {
            await tryConstraint({ focusMode: "single-shot" });
          }
          if (canContinuous) {
            clearTimeout(focusTimer);
            focusTimer = setTimeout(() => {
              if (camTrack) tryConstraint({ focusMode: "continuous" });
            }, 1500);
          }
        } else if (canContinuous) {
          if (
            !(await tryConstraint({
              focusMode: "continuous",
              pointsOfInterest: poi,
            }))
          ) {
            // สลับโหมดเพื่อให้กล้องโฟกัสใหม่
            if (modes.includes("manual"))
              await tryConstraint({ focusMode: "manual" });
            await new Promise((r) => setTimeout(r, 150));
            await tryConstraint({ focusMode: "continuous" });
          }
        }
      }

      function showFocusRing(x, y) {
        focusRing.style.left = x + "px";
        focusRing.style.top = y + "px";
        focusRing.classList.remove("show");
        void focusRing.offsetWidth;
        focusRing.classList.add("show");
      }

      function touchDistance(t) {
        const dx = t[0].clientX - t[1].clientX;
        const dy = t[0].clientY - t[1].clientY;
        return Math.hypot(dx, dy);
      }

      readerEl.addEventListener("click", (e) => {
        if (scannerState !== "running" || Date.now() - lastPinchAt < 400)
          return;
        const rect = readerEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;
        showFocusRing(x, y);
        focusAt(x / rect.width, y / rect.height);
      });

      readerEl.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length === 2) {
            pinchStartDist = touchDistance(e.touches);
            pinchStartZoom = zoomValue;
          }
        },
        { passive: true },
      );

      readerEl.addEventListener(
        "touchmove",
        (e) => {
          if (
            e.touches.length === 2 &&
            pinchStartDist > 0 &&
            camCaps &&
            camCaps.zoom
          ) {
            lastPinchAt = Date.now();
            applyZoom(
              (pinchStartZoom * touchDistance(e.touches)) / pinchStartDist,
            );
          }
        },
        { passive: true },
      );

      readerEl.addEventListener(
        "touchend",
        (e) => {
          if (e.touches.length < 2) {
            if (pinchStartDist > 0) lastPinchAt = Date.now();
            pinchStartDist = 0;
          }
        },
        { passive: true },
      );

      zoomRange.addEventListener("input", () =>
        applyZoom(parseFloat(zoomRange.value)),
      );
      zoomInBtn.addEventListener("click", () =>
        applyZoom(zoomValue + zoomStepSize()),
      );
      zoomOutBtn.addEventListener("click", () =>
        applyZoom(zoomValue - zoomStepSize()),
      );

      // ===== สแกน QR Code จากรูปภาพ (เลือกไฟล์ / ลากมาวาง / วางด้วย Ctrl+V) =====
      const pickBtn = document.getElementById("pickBtn");
      const fileInput = document.getElementById("fileInput");
      const previewBox = document.getElementById("preview");
      const previewImg = document.getElementById("previewImg");
      const previewName = document.getElementById("previewName");
      const previewClear = document.getElementById("previewClear");
      const scannerCard = document.querySelector(".scanner-card");
      let previewUrl = null;

      function showPreview(file) {
        clearPreview();
        previewUrl = URL.createObjectURL(file);
        previewImg.src = previewUrl;
        previewName.textContent = file.name || "รูปที่วางจากคลิปบอร์ด";
        previewBox.classList.add("show");
      }

      function clearPreview() {
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        previewImg.removeAttribute("src");
        previewName.textContent = "";
        previewBox.classList.remove("show");
      }

      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("โหลดรูปไม่สำเร็จ"));
          };
          img.src = url;
        });
      }

      // เติมขอบขาวรอบรูปและปรับขนาด ช่วยให้อ่าน QR ที่ถูกตัดชิดขอบหรือรูปเล็ก/ใหญ่เกินไป
      async function makePaddedImage(file) {
        const img = await loadImage(file);
        const w0 = img.naturalWidth,
          h0 = img.naturalHeight;
        const longest = Math.max(w0, h0);
        let scale = 1;
        if (longest > 1200) scale = 1200 / longest;
        else if (longest < 500) scale = 600 / longest;
        const w = Math.round(w0 * scale),
          h = Math.round(h0 * scale);
        const pad = Math.round(Math.max(w, h) * 0.12);
        const canvas = document.createElement("canvas");
        canvas.width = w + pad * 2;
        canvas.height = h + pad * 2;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, pad, pad, w, h);
        const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
        if (!blob) throw new Error("แปลงรูปไม่สำเร็จ");
        return new File([blob], "qr-padded.png", { type: "image/png" });
      }

      async function jsqrDecodeFile(file) {
        const img = await loadImage(file);
        const w0 = img.naturalWidth;
        const h0 = img.naturalHeight;
        for (const maxSide of [1600, 1000, 700]) {
          const scale = Math.min(1, maxSide / Math.max(w0, h0));
          const w = Math.round(w0 * scale);
          const h = Math.round(h0 * scale);
          const pad = Math.round(Math.max(w, h) * 0.1);
          const cw = w + pad * 2;
          const ch = h + pad * 2;
          const c = document.createElement("canvas");
          c.width = cw;
          c.height = ch;
          const ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, pad, pad, w, h);
          const data = ctx.getImageData(0, 0, cw, ch);
          const text = jsqrDecodeImageData(data, cw, ch, true);
          if (text) return text;
        }
        return "";
      }

      async function decodeQrFromFile(file) {
        // 1) ลองตัวอ่านของเครื่องก่อน (แม่นกว่า) 2) ถ้าไม่ติดค่อยใช้ไลบรารี
        const det = await getNativeDetector();
        if (det && typeof createImageBitmap === "function") {
          try {
            const bmp = await createImageBitmap(file);
            try {
              const codes = await det.detect(bmp);
              const hit = codes && codes.find((c) => c.rawValue);
              if (hit) return hit.rawValue;
            } finally {
              if (bmp.close) bmp.close();
            }
          } catch (_) {}
        }
        // ตัวอ่าน jsQR: ลองหลายขนาด + เติมขอบขาว (QR บนป้ายมักมีขอบขาวแคบ)
        if (await loadJsQR()) {
          try {
            const text = await jsqrDecodeFile(file);
            if (text) return text;
          } catch (_) {}
        }
        if (typeof Html5Qrcode === "undefined") throw new Error("EMPTY");
        const reader = new Html5Qrcode("fileReader");
        try {
          try {
            return await reader.scanFile(file, false);
          } catch (_) {}
          const padded = await makePaddedImage(file);
          return await reader.scanFile(padded, false);
        } finally {
          try {
            reader.clear();
          } catch (_) {}
        }
      }

      async function handleImageFile(file) {
        if (!file) return;
        if (!/^image\//.test(file.type || "")) {
          showStatus(
            "error",
            "ไฟล์ไม่ใช่รูปภาพ",
            "กรุณาเลือกไฟล์รูป เช่น JPG หรือ PNG",
          );
          return;
        }
        if (processing) return;
        if (scannerState === "starting" || scannerState === "stopping") {
          showStatus(
            "warning",
            "กล้องกำลังเปลี่ยนสถานะ",
            "รอสักครู่แล้วลองเลือกรูปอีกครั้ง",
          );
          return;
        }
        if (scannerState === "running") await stopScanner();

        clearDetails();
        showPreview(file);
        showStatus("success", "กำลังอ่าน QR Code จากรูป...", "");

        try {
          try {
            await waitForQrLibrary();
          } catch (e) {
            if (!(await getNativeDetector()) && !(await loadJsQR())) throw e;
          }
          const text = fixText(await decodeQrFromFile(file));
          if (!text) throw new Error("EMPTY");
          processCode(text);
        } catch (err) {
          showStatus(
            "error",
            "อ่าน QR Code จากรูปไม่ได้",
            "ลองใช้รูปที่เห็น QR Code ทั้งอัน คมชัด ไม่เบลอหรือเอียงมาก หรือกรอกรหัสด้วยตนเอง",
          );
        }
      }

      pickBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        handleImageFile(file);
      });
      previewClear.addEventListener("click", clearPreview);

      ["dragenter", "dragover"].forEach((type) =>
        scannerCard.addEventListener(type, (e) => {
          e.preventDefault();
          scannerCard.classList.add("drag");
        }),
      );
      ["dragleave", "drop"].forEach((type) =>
        scannerCard.addEventListener(type, (e) => {
          e.preventDefault();
          scannerCard.classList.remove("drag");
        }),
      );
      scannerCard.addEventListener("drop", (e) => {
        const file =
          e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        handleImageFile(file);
      });
      document.addEventListener("paste", (e) => {
        const files = e.clipboardData && e.clipboardData.files;
        if (files && files.length && /^image\//.test(files[0].type || "")) {
          e.preventDefault();
          handleImageFile(files[0]);
        }
      });

      // ===== ตัวอ่าน QR แบบ native (BarcodeDetector ของ Chrome/Android) =====
      // แม่นและเร็วกว่าตัวถอดแบบ JavaScript มาก โดยเฉพาะ QR เล็ก/หมึกบวม/เอียง
      let nativeDetector = null;
      let nativeStream = null;
      let nativeVideo = null;
      let nativeTimer = null;
      let nativeRunning = false;
      let nativeFailCount = 0;
      let nativeDisabled = false; // ถ้า native ใช้ไม่ได้ ให้ไปใช้ไลบรารีแทน
      const APP_VERSION = "v4";
      let availableEngines = [];
      let preferredEngine = null; // null = เลือกอัตโนมัติ
      let currentEngine = "";
      const ENGINE_LABEL = {
        native: "ตัวอ่านของเครื่อง",
        jsqr: "jsQR",
        library: "ZXing (สำรอง)",
      };
      const diagEl = document.getElementById("diag");
      const engineBtn = document.getElementById("engineBtn");

      setInterval(() => {
        if (scannerState !== "running") {
          diagEl.textContent = "";
          return;
        }
        const v = document.querySelector("#reader video");
        const res = v && v.videoWidth ? v.videoWidth + "×" + v.videoHeight : "-";
        diagEl.textContent =
          APP_VERSION +
          " · " +
          (ENGINE_LABEL[currentEngine] || "") +
          " · กล้อง " +
          res +
          (currentEngine === "library" ? "" : " · ลอง " + diagFrames + " เฟรม");
      }, 500);

      engineBtn.addEventListener("click", async () => {
        if (scannerState !== "running") return;
        const list = availableEngines.length ? availableEngines : [currentEngine];
        const next = list[(list.indexOf(currentEngine) + 1) % list.length];
        preferredEngine = next;
        await stopScanner();
        startScanner();
      });

      async function getNativeDetector() {
        if (nativeDisabled || !("BarcodeDetector" in window)) return null;
        if (nativeDetector) return nativeDetector;
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (!formats.includes("qr_code")) return null;
          nativeDetector = new BarcodeDetector({ formats: ["qr_code"] });
          return nativeDetector;
        } catch (_) {
          return null;
        }
      }

      // แก้ข้อความที่ถอดผิด charset (UTF-8 อักษรไทยถูกอ่านเป็น Latin-1 เช่น "à¸‚à¸")
      function fixText(raw) {
        let t = String(raw || "").trim();
        try {
          if (
            t &&
            !/[\u0e00-\u0e7f]/.test(t) &&
            /[\u00c2-\u00f4][\u0080-\u00bf]/.test(t) &&
            [...t].every((c) => c.charCodeAt(0) <= 0xff)
          ) {
            const bytes = Uint8Array.from([...t].map((c) => c.charCodeAt(0)));
            const fixed = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
            if (/[\u0e00-\u0e7f]/.test(fixed)) t = fixed.trim();
          }
        } catch (_) {}
        return t;
      }

      function stopNative() {
        nativeRunning = false;
        clearTimeout(nativeTimer);
        nativeTimer = null;
        if (nativeStream) {
          try {
            nativeStream.getTracks().forEach((tr) => tr.stop());
          } catch (_) {}
        }
        if (nativeVideo) {
          try {
            nativeVideo.srcObject = null;
            nativeVideo.remove();
          } catch (_) {}
        }
        nativeStream = null;
        nativeVideo = null;
      }

      // เปิดกล้องเอง (ภาพ Full HD) ใช้ร่วมกันทั้งตัวอ่านของเครื่องและ jsQR
      async function startOwnCamera() {
        nativeFailCount = 0;
        const attempts = [
          {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 },
          },
          { facingMode: { ideal: "environment" } },
        ];
        let stream = null;
        let lastErr = null;
        for (const v of attempts) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: v,
              audio: false,
            });
            break;
          } catch (e) {
            lastErr = e;
            if (/NotAllowed|Permission|Security/i.test(String((e && e.name) || "")))
              break;
          }
        }
        if (!stream) throw lastErr || new Error("ไม่พบกล้อง");

        const video = document.createElement("video");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.setAttribute("muted", "");
        video.muted = true;
        video.autoplay = true;
        video.srcObject = stream;
        readerEl.innerHTML = "";
        readerEl.appendChild(video);
        try {
          await video.play();
        } catch (_) {}

        nativeStream = stream;
        nativeVideo = video;
      }

      async function startNative(detector) {
        await startOwnCamera();
        nativeDetector = detector;
        nativeRunning = true;
        nativeLoop();
      }

      // ===== ตัวอ่าน jsQR (ใช้บน iPhone/เบราว์เซอร์ที่ไม่มี BarcodeDetector) =====
      const JSQR_URLS = [
        "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js",
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
      ];
      let jsqrPromise = null;

      function loadScriptOnce(src, ms) {
        return new Promise((resolve, reject) => {
          const el = document.createElement("script");
          const t = setTimeout(() => {
            el.remove();
            reject(new Error("timeout"));
          }, ms);
          el.src = src;
          el.async = true;
          el.onload = () => {
            clearTimeout(t);
            resolve();
          };
          el.onerror = () => {
            clearTimeout(t);
            el.remove();
            reject(new Error("load error"));
          };
          document.head.appendChild(el);
        });
      }

      function loadJsQR() {
        if (typeof jsQR === "function") return Promise.resolve(true);
        if (jsqrPromise) return jsqrPromise;
        jsqrPromise = (async () => {
          for (const u of JSQR_URLS) {
            try {
              await loadScriptOnce(u, 8000);
              if (typeof jsQR === "function") return true;
            } catch (_) {}
          }
          jsqrPromise = null; // ให้ลองใหม่ได้ครั้งหน้า
          return false;
        })();
        return jsqrPromise;
      }
      window.addEventListener("load", () => setTimeout(loadJsQR, 600));

      const jsqrCanvas = document.createElement("canvas");
      const jsqrCtx = jsqrCanvas.getContext("2d", { willReadFrequently: true });
      const gammaLuts = {};
      let diagFrames = 0;

      function applyGamma(data, g) {
        let lut = gammaLuts[g];
        if (!lut) {
          lut = new Uint8ClampedArray(256);
          for (let i = 0; i < 256; i++) lut[i] = 255 * Math.pow(i / 255, g);
          gammaLuts[g] = lut;
        }
        for (let i = 0; i < data.length; i += 4) {
          data[i] = lut[data[i]];
          data[i + 1] = lut[data[i + 1]];
          data[i + 2] = lut[data[i + 2]];
        }
      }

      function jsqrText(r) {
        if (!r) return "";
        if (r.data) return r.data;
        try {
          if (r.binaryData && r.binaryData.length)
            return new TextDecoder("utf-8").decode(Uint8Array.from(r.binaryData));
        } catch (_) {}
        return "";
      }

      // ถอดจาก canvas/ภาพที่วาดไว้แล้ว ลองหลายแบบ (ปกติ / ปรับความสว่าง 2 แบบ)
      function jsqrDecodeImageData(img, w, h, withGamma) {
        let r = jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
        if (r && jsqrText(r)) return jsqrText(r);
        if (withGamma) {
          for (const g of [1.5, 0.7]) {
            const copy = new Uint8ClampedArray(img.data);
            applyGamma(copy, g);
            r = jsQR(copy, w, h, { inversionAttempts: "dontInvert" });
            if (r && jsqrText(r)) return jsqrText(r);
          }
        }
        return "";
      }

      let jsqrPass = 0;
      function jsqrDecodeVideo(video) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return "";
        // สลับ: กลางภาพ 70% (ละเอียดกว่า) / ทั้งเฟรม (กันกรณี QR ไม่อยู่กลาง)
        const full = jsqrPass++ % 3 === 2;
        const frac = full ? 1 : 0.7;
        const sw = Math.round(vw * frac);
        const sh = Math.round(vh * frac);
        const sx = Math.round((vw - sw) / 2);
        const sy = Math.round((vh - sh) / 2);
        const scale = Math.min(1, 1200 / Math.max(sw, sh));
        const cw = Math.round(sw * scale);
        const ch = Math.round(sh * scale);
        if (jsqrCanvas.width !== cw) jsqrCanvas.width = cw;
        if (jsqrCanvas.height !== ch) jsqrCanvas.height = ch;
        jsqrCtx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        const img = jsqrCtx.getImageData(0, 0, cw, ch);
        return jsqrDecodeImageData(img, cw, ch, !full);
      }

      async function startJsqr() {
        await startOwnCamera();
        nativeRunning = true;
        jsqrLoop();
      }

      function jsqrLoop() {
        if (!nativeRunning) return;
        try {
          const v = nativeVideo;
          if (v && v.readyState >= 2 && v.videoWidth > 0 && !processing) {
            diagFrames++;
            const text = jsqrDecodeVideo(v);
            if (text) onScanSuccess(text);
          }
        } catch (_) {}
        if (nativeRunning) nativeTimer = setTimeout(jsqrLoop, 40);
      }

      async function nativeLoop() {
        if (!nativeRunning) return;
        try {
          const v = nativeVideo;
          if (v && v.readyState >= 2 && v.videoWidth > 0 && !processing) {
            diagFrames++;
            const codes = await nativeDetector.detect(v);
            nativeFailCount = 0;
            if (codes && codes.length) {
              const hit = codes.find((c) => c.rawValue) || codes[0];
              if (hit && hit.rawValue) onScanSuccess(hit.rawValue);
            }
          }
        } catch (_) {
          nativeFailCount++;
          if (nativeFailCount >= 5) {
            // ตัวอ่านของระบบใช้งานไม่ได้ สลับไปใช้ไลบรารีสำรอง
            nativeRunning = false;
            switchToLibrary();
            return;
          }
        }
        if (nativeRunning) nativeTimer = setTimeout(nativeLoop, 70);
      }

      async function switchToLibrary() {
        nativeDisabled = true;
        await destroyScanner();
        showStatus(
          "warning",
          "สลับไปใช้ตัวอ่านสำรอง",
          "ตัวอ่านของเครื่องใช้ไม่ได้ กำลังเปิดกล้องใหม่",
        );
        startScanner();
      }

      // ===== ตัวอ่านสำรอง (ไลบรารี html5-qrcode) สำหรับเบราว์เซอร์ที่ไม่มี BarcodeDetector เช่น iPhone =====
      async function startLibrary() {
        const base = {
          fps: 20,
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
          // QR ไม่กลับด้าน ปิดการลองกลับด้านเพื่อให้ถอดเร็วขึ้นเท่าตัว
          disableFlip: true,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          // สแกนเกือบทั้งเฟรม ไม่ต้องจัด QR ให้ตรงกรอบเล็ก ๆ
          qrbox: (w, h) => {
            const side = Math.max(120, Math.floor(Math.min(w, h) * 0.92));
            return { width: side, height: side };
          },
        };
        // ลองขอภาพ Full HD ก่อน (ไม่บังคับสัดส่วน 1:1 ซึ่งทำให้ได้ภาพความละเอียดต่ำ)
        const tries = [
          {
            ...base,
            videoConstraints: {
              facingMode: "environment",
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
          },
          { ...base },
        ];

        let lastErr = null;
        for (const cfg of tries) {
          const inst = new Html5Qrcode("reader");
          scanner = inst;
          try {
            await inst.start(
              { facingMode: "environment" },
              cfg,
              onScanSuccess,
              () => {},
            );
            await setupCameraControls();
            return;
          } catch (err) {
            lastErr = err;
            scanner = null;
            try {
              await inst.clear();
            } catch (_) {}
            if (
              /NotAllowed|Permission|denied|Security/i.test(
                String((err && (err.name || err.message)) || err),
              )
            )
              break;
          }
        }
        throw lastErr || new Error("เปิดกล้องไม่ได้");
      }

      async function startScanner() {
        if (scannerState !== "idle") return;
        scannerState = "starting";
        warmUp();
        setScannerButtons();
        clearDetails();
        clearPreview();
        document.getElementById("camBox").classList.add("show");

        try {
          if (
            !window.isSecureContext ||
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
          ) {
            throw new Error("NO_MEDIA");
          }

          const detector = await getNativeDetector();
          // ไม่ต้องรอโหลด jsQR ถ้ามีตัวอ่านของเครื่องอยู่แล้ว
          const jsqrOk = detector ? typeof jsQR === "function" : await loadJsQR();
          availableEngines = [];
          if (detector) availableEngines.push("native");
          if (jsqrOk) availableEngines.push("jsqr");
          availableEngines.push("library");
          const engine =
            preferredEngine && availableEngines.includes(preferredEngine)
              ? preferredEngine
              : availableEngines[0];

          diagFrames = 0;
          if (engine === "native") {
            await startNative(detector);
            await setupCameraControls();
          } else if (engine === "jsqr") {
            await startJsqr();
            await setupCameraControls();
          } else {
            await waitForQrLibrary();
            await startLibrary();
          }
          currentEngine = engine;

          scannerState = "running";
          showStatus(
            "success",
            "พร้อมสแกน",
          );
        } catch (error) {
          stopNative();
          resetCameraControls();
          const failed = scanner;
          scanner = null;
          try {
            if (failed) await failed.clear();
          } catch (_) {}
          scannerState = "idle";
          document.getElementById("camBox").classList.remove("show");
          setScannerButtons();
          showCameraError(error);
        } finally {
          if (scannerState === "starting") scannerState = "idle";
          setScannerButtons();
        }
      }

      function showCameraError(error) {
        const msg = String(error?.message || error || "");
        let hint = "";
        if (isInAppBrowser()) {
          hint =
            "ดูเหมือนเปิดลิงก์ในแอป (เช่น LINE/Facebook) ซึ่งมักบล็อกกล้อง กรุณาเปิดลิงก์ด้วย Chrome/Safari แทน";
        } else if (msg === "NO_MEDIA") {
          hint =
            "เบราว์เซอร์ไม่อนุญาตให้ใช้กล้องในหน้านี้ ต้องเปิดผ่าน HTTPS ด้วย Chrome/Safari";
        } else if (
          /permission|denied|notallowed|not allowed|policy/i.test(msg)
        ) {
          hint =
            "กรุณากดไอคอนแม่กุญแจที่แถบที่อยู่เว็บ เลือก “อนุญาต” กล้อง แล้วกด “เริ่มสแกน” ใหม่";
        } else if (/NotFound|no camera|not found|ไม่พบ/i.test(msg)) {
          hint =
            "ไม่พบกล้องในอุปกรณ์นี้ กรุณาใช้อุปกรณ์ที่มีกล้อง หรือกรอกรหัสด้วยตนเอง";
        } else {
          hint = escapeHtml(msg || "กรุณาลองใหม่");
        }
        const raw = escapeHtml(
          (error && error.name ? error.name + ": " : "") + msg,
        );
        showStatus(
          "error",
          "เปิดกล้องไม่ได้",
          hint +
            '<br><small style="color:#98a2b3">รายละเอียด: ' +
            raw +
            "</small>",
        );
      }

      async function destroyScanner() {
        resetCameraControls();
        stopNative();
        const old = scanner;
        scanner = null;
        scannerState = "idle";
        if (old) {
          try {
            await old.stop();
          } catch (_) {}
          try {
            old.clear();
          } catch (_) {}
        }
        document.getElementById("camBox").classList.remove("show");
        setScannerButtons();
      }

      async function stopScanner() {
        if (scannerState !== "running") return;
        scannerState = "stopping";
        setScannerButtons();
        await destroyScanner();
      }

      function onScanSuccess(decodedText) {
        const code = fixText(decodedText);
        const now = Date.now();
        if (!code || processing) return;
        if (code === lastCode && now - lastScanTime < 3000) return;
        lastCode = code;
        lastScanTime = now;
        try {
          if (navigator.vibrate) navigator.vibrate(60);
        } catch (_) {}
        processCode(code);
      }

      function submitManual() {
        const code = manualCode.value.trim();
        if (!code) {
          showStatus("error", "กรุณากรอกรหัส", "");
          return;
        }
        processCode(code);
      }

      // เรียก Apps Script ด้วย JSONP (หน้านี้โฮสต์นอก Apps Script จึงใช้ google.script.run ไม่ได้)
      async function processCode(code) {
        if (!code || processing) return;
        processing = true;
        document.body.classList.add("loading");

        showStatus("success", "กำลังตรวจสอบ...", "รหัส " + escapeHtml(code));
        clearDetails();

        const MAX_ATTEMPTS = 3; // ส่งครั้งแรก + ลองใหม่อัตโนมัติ 2 ครั้ง
        const ATTEMPT_TIMEOUT_MS = 12000;
        const startedAt = Date.now();
        // รหัสคำขอเดียวกันทุกครั้งที่ส่งซ้ำ ให้เซิร์ฟเวอร์รู้ว่าเป็นการสแกนครั้งเดียวกัน
        const rid =
          Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        const pending = []; // { name, script }
        let finished = false;
        let attempts = 0;
        let retryTimer = null;

        function cleanup() {
          clearInterval(ticker);
          clearTimeout(retryTimer);
          processing = false;
          document.body.classList.remove("loading");
          pending.forEach((p) => {
            // เก็บ callback เป็น no-op ไว้ เผื่อคำตอบเก่ามาถึงทีหลัง จะได้ไม่ error
            window[p.name] = function () {};
            p.script.remove();
          });
        }

        function fail() {
          if (finished) return;
          finished = true;
          cleanup();
          showStatus(
            "error",
            "เชื่อมต่อ Apps Script ไม่สำเร็จ",
            "ลองแล้ว " +
              MAX_ATTEMPTS +
              " ครั้งแต่ไม่มีคำตอบ ตรวจสอบอินเทอร์เน็ต/ลองเปิดด้วย Chrome แล้วสแกนใหม่ (หรือกรอกรหัสด้วยตนเอง)",
          );
        }

        function scheduleNext() {
          clearTimeout(retryTimer);
          retryTimer = setTimeout(() => {
            if (finished) return;
            if (attempts >= MAX_ATTEMPTS) return fail();
            sendAttempt();
          }, ATTEMPT_TIMEOUT_MS);
        }

        function sendAttempt() {
          attempts++;
          const name =
            "stockCb_" +
            Date.now() +
            "_" +
            attempts +
            "_" +
            Math.floor(Math.random() * 100000);
          const script = document.createElement("script");
          pending.push({ name, script });

          window[name] = function (result) {
            if (finished) return;
            finished = true;
            const retried = attempts > 1;
            cleanup();
            handleResult(result, retried);
          };

          // ถ้าโหลดสคริปต์ล้มเหลวทันที (เครือข่ายหลุด) ให้ลองใหม่ทันทีไม่ต้องรอครบ 12 วินาที
          script.onerror = function () {
            if (finished) return;
            if (attempts >= MAX_ATTEMPTS) return fail();
            clearTimeout(retryTimer);
            retryTimer = setTimeout(sendAttempt, 800);
          };

          script.async = true;
          script.src =
            API_URL +
            "?action=markAsCounted" +
            "&code=" +
            encodeURIComponent(code) +
            "&rid=" +
            rid +
            "&callback=" +
            encodeURIComponent(name);
          document.body.appendChild(script);

          scheduleNext();
        }

        // แสดงจำนวนวินาทีที่รอ เพื่อให้รู้ว่าระบบยังทำงานอยู่
        const ticker = setInterval(() => {
          if (finished) return;
          const sec = Math.floor((Date.now() - startedAt) / 1000);
          if (sec >= 3) {
            showStatus(
              "success",
              "กำลังตรวจสอบ...",
              "รหัส " +
                escapeHtml(code) +
                "<br>กำลังรอผลจากชีต... " +
                sec +
                " วินาที" +
                (attempts > 1 ? " (ส่งซ้ำอัตโนมัติ ครั้งที่ " + attempts + ")" : ""),
            );
          }
        }, 1000);

        sendAttempt();

        // ส่งคำขอไปก่อน แล้วค่อยปิดกล้องพร้อมกัน (ไม่ต้องรอปิดกล้องเสร็จ)
        if (scannerState === "running") stopScanner();
      }

      // ปลุก Apps Script ล่วงหน้า ลดอาการช้าในการสแกนครั้งแรก (cold start)
      let lastWarmAt = 0;
      function warmUp() {
        if (Date.now() - lastWarmAt < 3 * 60 * 1000) return;
        lastWarmAt = Date.now();
        const cb = "warmCb_" + Date.now();
        const s = document.createElement("script");
        const done = () => {
          try {
            delete window[cb];
          } catch (_) {
            window[cb] = undefined;
          }
          s.remove();
        };
        window[cb] = done;
        s.onerror = done;
        s.async = true;
        s.src = API_URL + "?action=ping&callback=" + encodeURIComponent(cb);
        document.body.appendChild(s);
      }
      window.addEventListener("load", () => setTimeout(warmUp, 300));

      function handleResult(result, retried) {
        if (!result) {
          showStatus(
            "error",
            "เกิดข้อผิดพลาด",
            "ไม่ได้รับข้อมูลจาก Apps Script",
          );
          return;
        }
        if (result.type === "NOT_FOUND") {
          showStatus(
            "error",
            "ไม่พบข้อมูล",
            "รหัส " + escapeHtml(result.code || ""),
          );
          return;
        }
        if (result.type === "INVALID") {
          showStatus(
            "error",
            "ข้อมูลไม่ถูกต้อง",
            escapeHtml(result.message || "กรุณาตรวจสอบรหัส"),
          );
          return;
        }
        if (result.type === "LOCK_TIMEOUT") {
          showStatus(
            "warning",
            "ระบบกำลังประมวลผล",
            escapeHtml(result.message || "กรุณาลองใหม่อีกครั้ง"),
          );
          return;
        }
        if (result.type === "EMPTY_SHEET") {
          showStatus(
            "error",
            "ไม่พบข้อมูลในชีต",
            escapeHtml(result.message || "ชีต Stock ยังไม่มีข้อมูล"),
          );
          return;
        }
        if (result.type === "SERVER_ERROR") {
          const detail =
            (result.errorName ? result.errorName + ": " : "") +
            (result.message || "ไม่ทราบสาเหตุ");
          showStatus(
            "error",
            "Apps Script เกิดข้อผิดพลาด",
            "<b>รายละเอียด:</b> " + escapeHtml(detail),
          );
          return;
        }
        if (result.type === "ALREADY_COUNTED") {
          showStatus(
            "warning",
            "รายการนี้นับแล้ว",
            "นับเมื่อ " +
              escapeHtml(result.asset?.countedAt || "-") +
              (retried
                ? "<br><small>(ระบบส่งซ้ำอัตโนมัติ รายการนี้อาจเพิ่งถูกบันทึกจากการส่งครั้งแรก)</small>"
                : ""),
          );
          renderDetails(result.asset);
          return;
        }
        if (result.type === "COUNTED") {
          showStatus(
            "success",
            "นับรายการเรียบร้อย",
            "บันทึกเมื่อ " + escapeHtml(result.asset?.countedAt || "-"),
          );
          renderDetails(result.asset);
          return;
        }
        showStatus(
          "error",
          "ไม่ทราบผลการตรวจสอบ",
          "<b>รายละเอียด:</b> " + escapeHtml(JSON.stringify(result)),
        );
      }

      function renderDetails(asset) {
        if (!asset) return;
        const rows = [
          ["รหัส", asset.code],
          ["ชื่อครุภัณฑ์", asset.name],
          ["จำนวนเงิน", formatNumber(asset.amount)],
          ["จำนวนปัจจุบัน", asset.currentQuantity],
          ["สถานะ", asset.counted],
          ["วันเวลาที่ตรวจนับ", asset.countedAt],
          ["Location", asset.location],
          ["หมายเหตุ", asset.note],
        ];
        details.innerHTML = rows
          .map(
            ([label, value]) =>
              '<div class="detail-row"><div class="detail-label">' +
              escapeHtml(label) +
              "</div>" +
              '<div class="detail-value">' +
              escapeHtml(value ?? "-") +
              "</div></div>",
          )
          .join("");
        details.classList.add("show");
        nextBtn.style.display = "flex";
      }

      function clearDetails() {
        details.innerHTML = "";
        details.classList.remove("show");
        nextBtn.style.display = "none";
      }

      function showStatus(type, title, message) {
        statusBox.className = "status show " + type;
        let icon = "fa-circle-check";
        if (/^กำลัง/.test(title)) icon = "fa-spinner fa-spin";
        else if (type === "warning") icon = "fa-triangle-exclamation";
        else if (type === "error") icon = "fa-circle-xmark";
        statusBox.innerHTML =
          '<div class="status-title"><i class="fa-solid ' +
          icon +
          '"></i><span>' +
          title +
          "</span>" +
          '</div><div class="status-code">' +
          (message || "") +
          "</div>";
      }

      function formatNumber(value) {
        if (value === null || value === undefined || value === "") return "-";
        const number = Number(value);
        return Number.isFinite(number)
          ? number.toLocaleString("th-TH", { maximumFractionDigits: 2 })
          : String(value);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      startBtn.addEventListener("click", startScanner);
      stopBtn.addEventListener("click", stopScanner);
      manualBtn.addEventListener("click", submitManual);
      nextBtn.addEventListener("click", startScanner);
      manualCode.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitManual();
      });

      setScannerButtons();
      if (isInAppBrowser()) {
        showStatus(
          "warning",
          "แนะนำให้เปิดด้วย Chrome/Safari",
        );
      }
    </script>
  </body>
</html>
